name: Unit checks
# Fast, standard-library checks on every pull request and push to main:
# selector/scheduler behavior, config round-trip, and cached-map fingerprint.
# The Docker benchmark stays manual (benchmark.yml).
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Cached map matches its builder
        run: python tools/map_fingerprint.py --check maps/dependencies.meta.json --map maps/dependencies.json.gz
