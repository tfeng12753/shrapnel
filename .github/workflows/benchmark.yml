name: Benchmark pinned sqlglot
on:
  workflow_dispatch:
    inputs:
      executor_ab:
        description: Compare the executor fixture and plan checks against main’s settings
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate selector mechanics
        run: make unit
      - name: Build and compare selection strategies
        if: ${{ !inputs.executor_ab }}
        run: make competitive
      - name: Compare executor checks under scorer limits
        if: ${{ inputs.executor_ab }}
        run: python tools/competitive.py --executor-ab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blast-radius-research
          path: |
            research-bundle.zip
            competitive-results.json
            selector-config.json
            maps/dependencies.json
          if-no-files-found: warn
